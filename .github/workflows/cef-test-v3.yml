name: CEF tests v3

on:
  pull_request:
    branches: [master]
    paths:
      - 'v3/**'
      - '.github/workflows/cef-test-v3.yml'
  push:
    branches: [master]
    paths:
      - 'v3/**'
      - '.github/workflows/cef-test-v3.yml'
  workflow_dispatch:
    inputs:
      hardware_platform:
        description: 'Use a dedicated cef-hardware self-hosted runner with real camera and microphone'
        type: choice
        default: none
        options: [none, windows64, macosarm64]

permissions:
  contents: read

concurrency:
  group: cef-tests-v3-${{ github.event.pull_request.number || github.ref }}-${{ inputs.hardware_platform || 'none' }}
  cancel-in-progress: true

jobs:
  compatibility:
    # Check both the default backend and opt-in CEF build on native runners.
    name: Backend compatibility (${{ matrix.os }}, ${{ matrix.tags || 'default' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tags: ['', wails_cef]
        include:
          - os: ubuntu-latest
            tags: gtk3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          ./.github/scripts/prune-runner-apt-sources.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libwayland-dev build-essential pkg-config xvfb dbus-x11
      - name: Build native application and test backend selection
        working-directory: v3
        shell: bash
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go build -tags "$BUILD_TAGS" ./pkg/application ./examples/plain ./examples/window ./examples/window-api ./examples/dialogs
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a go test -tags "$BUILD_TAGS" ./pkg/application -run 'Test(ParseWebviewBackend|ResolveWebviewBackend|WebviewBackend)' -count=1
          else
            go test -tags "$BUILD_TAGS" ./pkg/application -run 'Test(ParseWebviewBackend|ResolveWebviewBackend|WebviewBackend)' -count=1
          fi
      - name: Run unmodified upstream window and dialog tests
        working-directory: v3
        shell: bash
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a python3 examples/cef/upstream_tests.py --tags "$BUILD_TAGS" --output "$RUNNER_TEMP/upstream-tests"
          else
            python examples/cef/upstream_tests.py --tags "$BUILD_TAGS" --output "$RUNNER_TEMP/upstream-tests"
          fi
      - name: Upload upstream test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-window-dialog-${{ matrix.os }}-${{ matrix.tags || 'default' }}
          path: ${{ runner.temp }}/upstream-tests/
          retention-days: 7

  linux_cef:
    name: CEF 154 Linux (${{ matrix.toolkit }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        toolkit: [gtk3, gtk4]
    env:
      CEF_BUILD_TAGS: ${{ matrix.toolkit == 'gtk3' && 'gtk3,wails_cef' || 'wails_cef' }}
      CEF_ARCHIVE: cef_binary_154.0.28+g564dd6c+chromium-154.0.8037.58_linux64_minimal
      # Published linux64 minimal checksum from cef-builds.spotifycdn.com/index.json.
      CEF_SHA1: 5dfe49d73b0d3635354c705938e26074f287b1de
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      - name: Install GTK3 and private-display test dependencies
        run: |
          ./.github/scripts/prune-runner-apt-sources.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config libnss3 libasound2t64 libgbm1 libgl1-mesa-dri xvfb openbox xdotool x11-utils imagemagick xclip python3-pil python3-gi gir1.2-gtk-3.0 gir1.2-ibus-1.0 ibus ibus-gtk3 ibus-gtk4 dbus-x11
      - name: Cache pinned CEF archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef-download
          key: cef-linux64-${{ env.CEF_SHA1 }}
      - name: Verify and extract CEF runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cef-download" "$RUNNER_TEMP/cef-runtime"
          archive="$RUNNER_TEMP/cef-download/$CEF_ARCHIVE.tar.bz2"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE.tar.bz2" -o "$archive"
          fi
          echo "$CEF_SHA1  $archive" | sha1sum --check --strict
          tar -xjf "$archive" -C "$RUNNER_TEMP" "$CEF_ARCHIVE/Release" "$CEF_ARCHIVE/Resources"
          cp -a "$RUNNER_TEMP/$CEF_ARCHIVE/Release/." "$RUNNER_TEMP/cef-runtime/"
          cp -a "$RUNNER_TEMP/$CEF_ARCHIVE/Resources/." "$RUNNER_TEMP/cef-runtime/"
      - name: Build and unit test CEF configuration
        working-directory: v3
        run: |
          go build -tags "$CEF_BUILD_TAGS" -o "$RUNNER_TEMP/cef-smoke" ./examples/cef
          dbus-run-session -- xvfb-run -a go test -tags "$CEF_BUILD_TAGS" ./pkg/application ./internal/cef -timeout 5m -skip TestService
      - name: Test interaction, permissions, file drops and DevTools shutdown
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --runtime "$RUNNER_TEMP/cef-runtime" --switches "use-gl=angle,use-angle=swiftshader,enable-unsafe-swiftshader" --extended --devtools --output "$RUNNER_TEMP/cef-results/extended"
      - name: Test native file dialogs
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --runtime "$RUNNER_TEMP/cef-runtime" --switches "use-gl=angle,use-angle=swiftshader,enable-unsafe-swiftshader" --file-dialogs --output "$RUNNER_TEMP/cef-results/file-dialogs"
      - name: Test renderer crash event and auto-reload recovery
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --runtime "$RUNNER_TEMP/cef-runtime" --switches "use-gl=angle,use-angle=swiftshader,enable-unsafe-swiftshader" --crash --output "$RUNNER_TEMP/cef-results/crash"
      - name: Test Chinese IME composition
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --runtime "$RUNNER_TEMP/cef-runtime" --switches "use-gl=angle,use-angle=swiftshader,enable-unsafe-swiftshader" --ime --output "$RUNNER_TEMP/cef-results/ime"
      - name: Replay upstream window API and dialog examples
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --runtime "$RUNNER_TEMP/cef-runtime" --switches "use-gl=angle,use-angle=swiftshader,enable-unsafe-swiftshader" --extended --upstream --devtools --output "$RUNNER_TEMP/cef-results/upstream"
      - name: Test system backend in CEF build
        env:
          # Hosted runners disallow the network namespace used by bubblewrap.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        working-directory: v3
        run: /usr/bin/python3 examples/cef/smoke.py "$RUNNER_TEMP/cef-smoke" --backend system --output "$RUNNER_TEMP/cef-results/system"
      - name: Upload diagnostic logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-${{ matrix.toolkit }}-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cef-results/*/*.log
            ${{ runner.temp }}/cef-results/*/*.png
            ${{ runner.temp }}/cef-results/*/*.txt
            ${{ runner.temp }}/cef-runtime/debug.log

  native_cef:
    name: CEF 154 native (${{ matrix.os }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_platform == matrix.platform && fromJSON(format('["self-hosted","cef-hardware","{0}","{1}"]', matrix.runner_label, matrix.runner_arch)) || matrix.os }}
    env:
      CEF_HARDWARE_MEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.hardware_platform == matrix.platform }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows64
            runner_label: Windows
            runner_arch: X64
            executable: cef-smoke.exe
          - os: macos-14
            platform: macosarm64
            runner_label: macOS
            runner_arch: ARM64
            executable: cef-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native interaction test dependencies
        run: python -m pip install PyAutoGUI==0.9.54 Pillow==11.3.0 tkinterdnd2==0.6.3 websocket-client==1.9.0
      - name: Build CEF example and test native binding
        working-directory: v3
        shell: bash
        env:
          CGO_ENABLED: '1'
          CEF_EXECUTABLE: ${{ matrix.executable }}
        run: |
          go build -tags wails_cef -o "$RUNNER_TEMP/$CEF_EXECUTABLE" ./examples/cef
          go build -tags wails_cef -o "$RUNNER_TEMP/cef-helper" ./cmd/cefhelper
          go test -tags wails_cef ./internal/cef ./pkg/application -run 'Test(RuntimeDir|CheckRuntimeDir|Probe|ParseWebviewBackend|ResolveWebviewBackend)' -count=1
      - name: Prepare pinned runtime and native application bundle
        shell: bash
        env:
          CEF_PLATFORM: ${{ matrix.platform }}
          CEF_EXECUTABLE: ${{ matrix.executable }}
        run: python v3/scripts/prepare-cef.py --platform "$CEF_PLATFORM" --binary "$RUNNER_TEMP/$CEF_EXECUTABLE" --helper-binary "$RUNNER_TEMP/cef-helper" --output "$RUNNER_TEMP/cef-native"
      - name: Test Windows CEF interaction
        if: runner.os == 'Windows'
        shell: bash
        run: python v3/examples/cef/native_smoke.py --suite "$RUNNER_TEMP/cef-smoke.exe" --runtime "$RUNNER_TEMP/cef-native/runtime" --output "$RUNNER_TEMP/cef-native-results"
      - name: Suppress first-run system prompts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # A fresh runner account shows "Do you want to enable Dictation?"
          # over the app the first time a text field gets focus after the
          # microphone permission was granted. Enable dictation up front so
          # the prompt never appears; the suite also dismisses stragglers.
          defaults write com.apple.assistant.support "Dictation Enabled" -bool true || true
          defaults write com.apple.HIToolbox dictationAutoEnable -bool true || true
          defaults write com.apple.HIToolbox AppleDictationAutoTrigger -bool false || true
          killall cfprefsd 2>/dev/null || true
      - name: Test macOS CEF interaction
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$RUNNER_TEMP/cef-native/CEFSmoke.app/Contents"
          # file-dialogs runs in its own fresh-runner job: after nine CEF
          # app lifecycles the runner's synthetic keyboard pipeline starts
          # dropping events, which is fatal only to this input-heavy flow.
          python v3/examples/cef/native_smoke.py --suite "$app/MacOS/CEFSmoke" --runtime "$app/Frameworks" --helper "$app/Frameworks/CEFSmoke Helper.app/Contents/MacOS/CEFSmoke Helper" --output "$RUNNER_TEMP/cef-native-results" --exclude file-dialogs
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-native-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cef-native-results/
            ${{ runner.temp }}/cef-native/runtime/debug.log
            ${{ runner.temp }}/cef-native/CEFSmoke.app/Contents/Frameworks/debug.log

  native_cef_filedialogs:
    name: CEF 154 native file-dialogs (macos-14)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native interaction test dependencies
        run: python -m pip install PyAutoGUI==0.9.54 Pillow==11.3.0 tkinterdnd2==0.6.3 websocket-client==1.9.0
      - name: Build CEF example
        working-directory: v3
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          go build -tags wails_cef -o "$RUNNER_TEMP/cef-smoke" ./examples/cef
          go build -tags wails_cef -o "$RUNNER_TEMP/cef-helper" ./cmd/cefhelper
      - name: Prepare pinned runtime and native application bundle
        shell: bash
        run: python v3/scripts/prepare-cef.py --platform macosarm64 --binary "$RUNNER_TEMP/cef-smoke" --helper-binary "$RUNNER_TEMP/cef-helper" --output "$RUNNER_TEMP/cef-native"
      - name: Test macOS CEF file dialogs
        shell: bash
        run: |
          app="$RUNNER_TEMP/cef-native/CEFSmoke.app/Contents"
          python v3/examples/cef/native_smoke.py --scenario file-dialogs "$app/MacOS/CEFSmoke" --runtime "$app/Frameworks" --helper "$app/Frameworks/CEFSmoke Helper.app/Contents/MacOS/CEFSmoke Helper" --output "$RUNNER_TEMP/cef-native-results"
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-native-filedialogs-macosarm64
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cef-native-results/
            ${{ runner.temp }}/cef-native/runtime/debug.log
