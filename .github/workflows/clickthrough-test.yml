name: Clickthrough Test

# Transparent-window per-pixel hit-testing (examples/clickthrough).
# Linux/Windows assert the full scenario including real click delivery.
# macOS asserts the hit-test engine (cursor warps need no permission); the
# click phase is best-effort behind an Accessibility TCC grant attempt and
# degrades to a SKIP when the grant does not take effect on hosted runners.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    name: Linux GTK3 (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb openbox xdotool imagemagick x11-utils libxfixes-dev
      - name: Build
        working-directory: v3
        run: go build -tags gtk3 -o /tmp/clickthrough ./examples/clickthrough/
      - name: Run hit-test scenario
        run: v3/examples/clickthrough/ci/test-linux.sh /tmp/clickthrough
      - name: Download Electron runtime
        run: |
          curl -sL -o /tmp/electron.zip https://github.com/electron/electron/releases/download/v44.4.5/electron-v44.4.5-linux-x64.zip
          mkdir -p /opt/electron && unzip -q /tmp/electron.zip -d /opt/electron
      - name: Build native bridge addon (Electron V8 headers)
        run: bash v3/internal/electron/nativeaddon/build-cpp.sh 44.4.5 /tmp/go_bridge_cpp.node
      - name: Run hit-test scenario (electron backend)
        env:
          WAILS_WEBVIEW_BACKEND: electron
          WAILS_ELECTRON_DIR: /opt/electron
          WAILS_ELECTRON_DISABLE_SANDBOX: "1"
          WAILS_ELECTRON_NATIVE_ADDON: /tmp/go_bridge_cpp.node
        run: v3/examples/clickthrough/ci/test-linux.sh /tmp/clickthrough
      - name: Build API compat scenario
        working-directory: v3
        run: go build -tags gtk3 -o /tmp/webview-compat ./examples/webview-compat/
      - name: Run API compat scenario (system backend)
        run: v3/examples/webview-compat/ci/test-compat.sh /tmp/webview-compat system
      - name: Run API compat scenario (electron backend)
        env:
          WAILS_WEBVIEW_BACKEND: electron
          WAILS_ELECTRON_DIR: /opt/electron
          WAILS_ELECTRON_DISABLE_SANDBOX: "1"
          WAILS_ELECTRON_NATIVE_ADDON: /tmp/go_bridge_cpp.node
        run: v3/examples/webview-compat/ci/test-compat.sh /tmp/webview-compat electron
      - name: Run API compat scenario (electron backend, native-uds)
        env:
          WAILS_WEBVIEW_BACKEND: electron
          WAILS_ELECTRON_DIR: /opt/electron
          WAILS_ELECTRON_DISABLE_SANDBOX: "1"
          WAILS_ELECTRON_EXPERIMENT: invoke-baseline,fetch-ipc,native-ipc
          WAILS_ELECTRON_NATIVE_ADDON: /tmp/go_bridge_cpp.node
          WAILS_COMPAT_CRASH: "1"
          WAILS_COMPAT_CHURN: "1"
        run: v3/examples/webview-compat/ci/test-compat.sh /tmp/webview-compat electron
      - name: Install IME test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ibus gir1.2-ibus-1.0 python3-gi openbox xdotool >/dev/null
      - name: Run IME scenario (electron backend)
        env:
          WAILS_ELECTRON_DIR: /opt/electron
          WAILS_ELECTRON_DISABLE_SANDBOX: "1"
          WAILS_ELECTRON_EXPERIMENT: native-ipc,native-http
          WAILS_ELECTRON_NATIVE_ADDON: /tmp/go_bridge_cpp.node
        run: bash v3/examples/webview-compat/ci/test-ime.sh /tmp/webview-compat
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickthrough-linux
          path: /tmp/clickthrough-*

  windows:
    name: Windows WebView2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
      - name: Build
        working-directory: v3
        run: go build -o ..\clickthrough.exe ./examples/clickthrough/
      - name: Run hit-test scenario
        shell: pwsh
        run: ./v3/examples/clickthrough/ci/test-windows.ps1 -AppPath clickthrough.exe

  electron-windows:
    name: Windows Electron
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
      - name: Install mingw g++
        shell: pwsh
        run: choco install mingw -y --no-progress
      - name: Download Electron (win32-x64)
        shell: pwsh
        run: |
          curl.exe -sL -o $env:RUNNER_TEMP\electron.zip https://github.com/electron/electron/releases/download/v44.4.5/electron-v44.4.5-win32-x64.zip
          Expand-Archive -Force $env:RUNNER_TEMP\electron.zip C:\electron
      - name: Build native addon (mingw g++, Electron V8 headers)
        shell: cmd
        run: |
          set PATH=C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;%PATH%
          curl.exe -sL -o headers.tar.gz https://www.electronjs.org/headers/v44.4.5/node-v44.4.5-headers.tar.gz
          mkdir headers && tar -xzf headers.tar.gz -C headers
          g++ -std=c++20 -fno-rtti -O2 -shared -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_WIN32_WINNT=0x0A00 -DV8_COMPRESS_POINTERS -DV8_COMPRESS_POINTERS_IN_SHARED_CAGE -DV8_ENABLE_SANDBOX -DV8_31BIT_SMIS_ON_64BIT_ARCH -DV8_EXTERNAL_CODE_SPACE -o go_bridge_cpp.node v3\internal\electron\nativeaddon\bridge.cc -Iheaders\node_headers\include\node -static -static-libgcc -static-libstdc++
      - name: Build compat app
        working-directory: v3
        run: go build -o ..\webview-compat.exe ./examples/webview-compat/
      - name: Run compat scenario (electron backend, windows)
        shell: bash
        env:
          WAILS_WEBVIEW_BACKEND: electron
          WAILS_ELECTRON_DIR: C:/electron
          WAILS_ELECTRON_DISABLE_SANDBOX: "1"
          WAILS_ELECTRON_EXPERIMENT: native-ipc,native-http
          WAILS_ELECTRON_NATIVE_ADDON: go_bridge_cpp.node
        run: bash v3/examples/webview-compat/ci/test-compat-win.sh ./webview-compat.exe

  macos:
    name: macOS (flips hard, click best-effort)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
      - name: Build
        working-directory: v3
        run: go build -o /tmp/clickthrough ./examples/clickthrough/
      - name: Run hit-test scenario
        run: v3/examples/clickthrough/ci/test-macos.sh /tmp/clickthrough
