<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CEF smoke</title>
<style>
body { margin: 0; background: white; color: #111; font: 18px sans-serif; }
h1 { --wails-draggable: drag; margin: 0; padding: 28px; height: 64px; background: rgb(30,102,245); color: white; }
section { padding: 24px; }
input, button { font: inherit; padding: 8px; }
#size { position: fixed; right: 16px; bottom: 12px; }
</style>
<h1>Wails + CEF: native embedding</h1>
<section>
<input id="name" placeholder="Type a name" aria-label="Name">
<button id="greet">Call Go</button>
<button id="red">Red</button>
<button id="tools">DevTools</button>
<p><button id="media">Media</button> <button id="new">New window</button> <button id="resize">Resize</button> <button id="quit">Quit</button></p>
<div id="drop" data-file-drop-target style="padding:20px;border:2px dashed #555">Drop files here</div>
<p id="output">Loading runtime…</p>
<p>Type a name and call Go. Ctrl+M tests Go → JavaScript.</p>
<p><button id="dialog">Dialog</button> <button id="attached">Attached dialog</button> <button id="close">Close window</button> <button id="overlay">Passthrough overlay</button> <button id="capture">Capture overlay</button> <button id="close-overlay">Close overlay</button></p>
</section>
<div id="size"></div>
<script type="module">
import { Call, Window } from '/wails/runtime.js';
const role = new URLSearchParams(location.search).get('role') || 'main';
const report = message => Call.ByName('main.ProbeService.Report', role + ':' + message);
const output = document.getElementById('output');
const size = document.getElementById('size');
function resized() { size.textContent = `${innerWidth} × ${innerHeight}`; }
addEventListener('resize', () => {resized(); report(`size:${innerWidth}x${innerHeight}`);}); resized();
output.textContent = `Runtime ready; invoke bridge: ${typeof window.chrome?.webview?.postMessage === 'function'}`;
document.title = role === 'main' ? 'CEF smoke ready' : `CEF smoke ${role} ready`;
report('ready');
document.addEventListener('pointerdown', e => report(`pointer:${e.clientX},${e.clientY}`));
for (const type of ['dragenter', 'drop']) document.addEventListener(type, e => report(`${type}:${e.clientX},${e.clientY}:types=${Array.from(e.dataTransfer?.types || [])}:enabled=${window._wails?.flags?.enableFileDrop}`), true);
document.getElementById('overlay').onclick = () => Call.ByName('main.ProbeService.Overlay', true);
document.getElementById('capture').onclick = () => Call.ByName('main.ProbeService.Overlay', false);
document.getElementById('close-overlay').onclick = () => Call.ByName('main.ProbeService.CloseOverlay');
const controls = () => report('controls:' + JSON.stringify(Object.fromEntries(
 [...document.querySelectorAll('button,input')].map(e => {const r=e.getBoundingClientRect();return [e.id,[r.x+r.width/2,r.y+r.height/2]];}))));
controls(); addEventListener('resize', controls);
document.getElementById('dialog').onclick = () => Call.ByName('main.ProbeService.Dialog', false);
document.getElementById('attached').onclick = () => Call.ByName('main.ProbeService.Dialog', true);
document.getElementById('close').onclick = () => Window.Close();
if (new URLSearchParams(location.search).get('passive') === '1') {
 setTimeout(async () => { output.textContent = await Call.ByName('main.ProbeService.Greet', 'PASSIVE'); document.body.style.background = 'lime'; report('passive:green'); }, 1800);
}
document.getElementById('resize').onclick = () => Call.ByName('main.ProbeService.Resize');
document.getElementById('quit').onclick = () => Call.ByName('main.ProbeService.Quit');
document.getElementById('new').onclick = () => Call.ByName('main.ProbeService.NewWindow');
document.getElementById('media').onclick = async () => {
 try {
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  const tracks = stream.getTracks();
  try {
   const video = document.createElement('video'); video.muted = true; video.srcObject = stream;
   await video.play();
   await Promise.race([new Promise(resolve => video.requestVideoFrameCallback(resolve)), new Promise((_,reject)=>setTimeout(()=>reject(Error('frame timeout')),5000))]);
   report(`media:frame:${video.videoWidth}x${video.videoHeight}`);
   const audioBytes = await new Promise((resolve, reject) => {
    const chunks = []; const recorder = new MediaRecorder(new MediaStream(stream.getAudioTracks()));
    const timeout = setTimeout(() => { recorder.stop(); reject(Error('audio capture timeout')); }, 5000);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onerror = reject;
    recorder.onstop = () => { clearTimeout(timeout); resolve(new Blob(chunks).size); };
    recorder.start(); setTimeout(() => recorder.stop(), 700);
   });
   if (audioBytes < 256) throw Error('no encoded audio samples');
   report(`media:audio-bytes:${audioBytes}`);
   report('media:allowed:' + tracks.map(t => t.kind).sort().join(','));
  } finally { tracks.forEach(t => t.stop()); }
 } catch(e) {
  report('media:' + e.name); report('media:error:' + e.message);
  report('media:devices:' + (await navigator.mediaDevices.enumerateDevices()).map(d => d.kind).join(','));
  for (const kind of ['audio', 'video']) {
   try {
    const stream = await navigator.mediaDevices.getUserMedia({[kind]:true});
    report(`media:diagnostic:${kind}:allowed`); stream.getTracks().forEach(t=>t.stop());
   } catch(error) { report(`media:diagnostic:${kind}:${error.name}:${error.message}`); }
  }
 }
};
for (const name of ['compositionstart', 'compositionupdate', 'compositionend']) {
 document.getElementById('name').addEventListener(name, event => report(name + ':' + event.data));
}
document.getElementById('red').onclick = () => { document.body.style.background = 'red'; };
document.getElementById('tools').onclick = () => Window.OpenDevTools();
document.getElementById('greet').onclick = async () => {
  try {
    output.textContent = await Call.ByName('main.ProbeService.Greet', document.getElementById('name').value);
    document.body.style.background = 'lime';
    document.title = 'CEF smoke RPC OK';
  } catch (e) { output.textContent = String(e); document.title = 'CEF smoke RPC ERROR'; }
};
</script>
</html>
