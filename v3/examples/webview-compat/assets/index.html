<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>webview-compat</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101418; color: #e6e6e6; padding: 24px; }
  #rpc { font-size: 14px; white-space: pre; }
</style>
</head>
<body>
<h2>webview-compat</h2>
<div id="rpc">benchmark running…</div>
<div style="margin-top:12px"><input id="ime" placeholder="IME target" autocomplete="off"/></div>
<div id="dragstrip" onmousedown="console.log('STRIP-MD')" style="--wails-draggable: drag; position: fixed; top: 0; left: 0; right: 0; height: 24px; background: #2a2f36; color: #8899aa; font-size: 12px; line-height: 24px; text-align: center; z-index: 9;">drag strip (frameless test)</div>

<script type="module">
  import * as wails from "/wails/runtime.js";

  // Payload-size sweep + transport matrix. Available transports depend on
  // the experiment mode (see preload): __compatInvoke = pure Electron IPC,
  // Call.ByName = fetch-ipc (Wails runtime), __nativeCall = N-API -> UDS -> Go.
  const PAYLOAD_SIZES = [1, 64, 1024, 65536, 1048576];

  // IME leg (driven by ci/test-ime.sh): composition milestones and the
  // committed text ride the normal bindings path so the host log can
  // assert the full preedit -> commit -> RPC chain.
  const imeInput = document.getElementById("ime");
  imeInput.addEventListener("compositionstart", () => {
    wails.Call.ByName("main.CompatService.ImeReport", "compositionstart", "");
  });
  imeInput.addEventListener("compositionend", async (e) => {
    await wails.Call.ByName("main.CompatService.ImeReport", "compositionend", (e && e.data) || "");
    await new Promise((r) => setTimeout(r, 200));
    await wails.Call.ByName("main.CompatService.ImeReport", "value", imeInput.value);
  });
  imeInput.focus();
  const METHOD = "main.CompatService.Ping";

  function pct(sorted, p) {
    const i = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
    return sorted[Math.max(0, i)];
  }

  async function benchPath(name, fn, size, n) {
    const payload = "x".repeat(size);
    for (let i = 0; i < 10; i++) await fn(payload); // warmup
    const samples = [];
    for (let i = 0; i < n; i++) {
      const t0 = performance.now();
      const r = await fn(payload);
      const t1 = performance.now();
      if (r !== payload) throw new Error(name + " echo mismatch");
      samples.push(t1 - t0);
    }
    samples.sort((a, b) => a - b);
    return {
      path: name, size: size, n: samples.length,
      avg: Number((samples.reduce((a, b) => a + b, 0) / samples.length).toFixed(3)),
      p50: Number(pct(samples, 50).toFixed(3)),
      p95: Number(pct(samples, 95).toFixed(3)),
      p99: Number(pct(samples, 99).toFixed(3)),
    };
  }

  async function bench() {
    const paths = [];
    if (window.__compatInvoke) paths.push(["invoke", (p) => window.__compatInvoke(p)]);
    // Call.ByName rides whichever transport the preload installed for
    // /wails/runtime: the UDS data plane (native-http) or fetch-ipc.
    // The flag flips during preload (before page fetches), so resolve
    // the label lazily when the row is emitted.
    // label by transport actually wired: the v3 invoke frame (UDS) or
    // the retired fetch-ipc name kept only for old log comparison
    const httpName = () => window.__nativeInvoke ? "native-uds" : "fetch-ipc";
    paths.push(["__http__", (p) => wails.Call.ByName(METHOD, p)]);
    const nameOf = (name) => name === "__http__" ? httpName() : name;
    // native transport arrives via late injection after page load — wait for it
    const nativeDeadline = Date.now() + 10000;
    while (!window.__nativeCall && Date.now() - nativeDeadline < 10000) {
      await new Promise((r) => setTimeout(r, 50));
    }
    if (window.__nativeEcho) paths.push(["native-uds", (p) => window.__nativeEcho(p)]);

    for (const [name, fn] of paths) {
      for (const size of PAYLOAD_SIZES) {
        if (size >= 1048576 && nameOf(name) === "fetch-ipc") {
          // Known transport limit: the electron control protocol splits the
          // oversized request body and the runtime JSON parser rejects the
          // halves. The UDS data plane carries megabyte frames and covers
          // the full sweep when active.
          continue;
        }
        const n = size >= 1048576 ? 20 : size >= 65536 ? 50 : 100;
        try {
          const row = await benchPath(nameOf(name), fn, size, n);
          wails.Events.Emit("compat:bench", row);
        } catch (e) {
          wails.Events.Emit("compat:bench-error", name + " " + size + ": " + (e && e.message || e));
        }
      }
      wails.Events.Emit("compat:bench-done", name);
    }
    wails.Events.Emit("compat:bench-finished", true);
    document.getElementById("rpc").textContent = "bench complete";
  }

  // bindings error path: a Go error must reject the promise with the
  // error text intact (asserted host-side via this event). Runs before
  // the bench — the host suite checks the flag at suite end.
  (async () => {
    try {
      await wails.Call.ByName("main.CompatService.Fail", "boom");
      wails.Events.Emit("compat:rpc-error-prop", "NO-THROW");
    } catch (e) {
      wails.Events.Emit("compat:rpc-error-prop", String((e && e.message) || e));
    }
  })();

  bench();
</script>
</body>
</html>
