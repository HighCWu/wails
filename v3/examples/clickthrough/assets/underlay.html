<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Underlay</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #14532d; color: #fff;
    font-family: system-ui, sans-serif; user-select: none;
  }
  #wrap { padding: 24px; }
  h1 { font-size: 26px; margin: 0 0 12px 0; }
  #count { font-size: 64px; font-weight: 700; }
  #last { font-size: 14px; margin-top: 10px; color: #bbf7d0; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Underlay — clicks landing here prove pass-through</h1>
  <div id="count">0</div>
  <div id="last">click anywhere on this page</div>
</div>
<script>
  let n = 0;
  const count = document.getElementById("count");
  const last = document.getElementById("last");
  document.addEventListener("click", (e) => {
    n++;
    count.textContent = n;
    last.textContent = "last click at " + Math.round(e.clientX) + "," + Math.round(e.clientY);
  });
</script>
</body>
</html>
