<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Underlay</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #14532d; color: #fff;
    font-family: system-ui, sans-serif;
  }
  /* full-page text input: any point over the underlay is over an editable
     field, so the cursor that shows through the overlay's transparent
     regions must be the I-beam — CI asserts exactly that */
  #bginput {
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: transparent; border: none; outline: none;
    font-size: 20px; color: #bbf7d0; caret-color: #4ade80;
    padding: 96px 24px; box-sizing: border-box;
  }
  #wrap { position: relative; z-index: 1; padding: 24px; pointer-events: none; }
  h1 { font-size: 26px; margin: 0 0 12px 0; }
  #count { font-size: 64px; font-weight: 700; }
  #last { font-size: 14px; margin-top: 10px; color: #bbf7d0; }
</style>
</head>
<body>
<input id="bginput" spellcheck="false">
<div id="wrap">
  <h1>Underlay — clicks landing here prove pass-through</h1>
  <div id="count">0</div>
  <div id="last">click anywhere on this page</div>
</div>
<script type="module">
  import * as wails from "/wails/runtime.js";
  let n = 0;
  const count = document.getElementById("count");
  const last = document.getElementById("last");
  document.addEventListener("click", (e) => {
    n++;
    count.textContent = n;
    last.textContent = "last click at " + Math.round(e.clientX) + "," + Math.round(e.clientY);
    wails.Events.Emit("ct:underlay-clicks", n);
  });
</script>
</body>
</html>
